name: vkb_bakery
description: VKB Bakery ERP — Flutter App
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  another_flushbar: 1.12.30
  cached_network_image: 3.3.1
  dio: 5.4.3
  dropdown_search: 5.0.6
  equatable: 2.0.5
  fl_chart: 0.68.0
  flutter:
    sdk: flutter
  flutter_slidable: 3.1.1
  flutter_staggered_animations: 1.1.1
  freezed_annotation: 2.4.1
  google_fonts: 6.2.1
  hive: 2.2.3
  hive_flutter: 1.1.0
  image_picker: 1.1.2
  intl: 0.19.0
  json_annotation: 4.9.0
  lottie: 3.1.2
  pdf: 3.11.0
  pretty_dio_logger: 1.3.1
  printing: 5.13.1
  provider: 6.1.2
  retrofit: 4.1.0
  shared_preferences: 2.2.3
  shimmer: 3.0.0
  supabase_flutter: ^2.14.1
  uuid: 4.4.0
  blue_thermal_printer: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1  # ← add பண்ணோம்

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#DC2626"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  assets:
    - assets/images/
    - assets/lottie/